<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuyumcunun Anlattıkları — Masal Masal İçinde</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #162447 0%, #070b14 70%);
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: #ffd966;
      font-size: clamp(1.35rem, 3.5vw, 1.85rem);
      margin-bottom: 4px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.92rem;
      margin-bottom: 18px;
    }

    .player-card {
      background: #0f172a;
      border: 1px solid rgba(255, 217, 102, 0.3);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      background: #02050b;
      display: block;
    }

    .scenes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      background: #131f38;
      color: #f8fafc;
      border: 1px solid rgba(255, 217, 102, 0.3);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.84rem;
      cursor: pointer;
    }

    button:hover {
      background: #ffd966;
      color: #070b14;
      font-weight: 700;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.82rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kuyumcunun Anlattıkları</h1>
    <p class="subtitle">Ahmet Ümit — Masal Masal İçinde</p>

    <div class="player-card">
      <video id="siteVideo" controls playsinline preload="metadata" src="video.mp4"></video>

      <div class="scenes">
        <button type="button" onclick="seekTo(0)">00:00 Başlangıç</button>
        <button type="button" onclick="seekTo(20)">00:20 1. Sahne</button>
        <button type="button" onclick="seekTo(68)">01:08 2. Sahne</button>
        <button type="button" onclick="seekTo(90)">01:30 3. Sahne</button>
        <button type="button" onclick="seekTo(113)">01:53 4. Sahne</button>
        <button type="button" onclick="seekTo(143)">02:23 Final</button>
      </div>

      <p class="hint">Tam ekran yapmak için oynatıcının sağ altındaki tam ekran simgesine dokunabilirsin.</p>
    </div>
  </div>

  <script>
    function seekTo(seconds) {
      const video = document.getElementById("siteVideo");
      video.currentTime = seconds;
      video.play().catch(function () {});
    }
  </script>
</body>
</html>
